<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Gaussian Integral Simulation — I = √π</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #040406;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e0e6ed;
        }
        #glcanvas {
            width: 100vw;
            height: 100vh;
            display: block;
            outline: none;
        }
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #040406;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.4s ease;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(0, 180, 255, 0.2);
            border-top-color: #00b4ff;
            border-radius: 50%;
            animation: spin 1s infinite linear;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            font-weight: 500;
            font-size: 1.25rem;
            color: #78a8ff;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }
        p {
            font-size: 0.9rem;
            color: #8a99a8;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">
        <div class="spinner"></div>
        <h2>Loading Gaussian Integral Simulation...</h2>
        <p>Initializing WebAssembly & 3D WebGL Viewport</p>
    </div>

    <canvas id="glcanvas" tabindex="1" oncontextmenu="event.preventDefault()"></canvas>

    <!-- Miniquad / Macroquad WASM Loader Bundle -->
    <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
    <script>
        window.addEventListener("load", function() {
            setTimeout(function() {
                var overlay = document.getElementById("loading-overlay");
                if (overlay) {
                    overlay.style.opacity = "0";
                    setTimeout(function() { overlay.style.display = "none"; }, 400);
                }
            }, 600);
        });

        load("gaussian-integral.wasm");
    </script>
</body>
</html>
